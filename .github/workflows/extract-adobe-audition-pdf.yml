name: Extract Adobe Audition PDF

on:
  push:
    paths:
      - '.github/workflows/extract-adobe-audition-pdf.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Extract text
        run: |
          pdftotext -layout '196________Adobe_Au.pdf' '196________Adobe_Au.txt'
          wc -l '196________Adobe_Au.txt'
          head -n 30 '196________Adobe_Au.txt'

      - name: Commit extracted text
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '196________Adobe_Au.txt'
          git diff --cached --quiet || git commit -m 'Extract text from Adobe Audition PDF'
          git push
